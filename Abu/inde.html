<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WIFI</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #fafafa;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .container {
      width: 350px;
      border: 1px solid #dbdbdb;
      background: #fff;
      padding: 40px 30px;
      text-align: center;
    }
    .logo {
      font-family: 'Billabong', cursive;
      font-size: 50px;
      margin-bottom: 20px;
    }
    input {
      width: 100%;
      padding: 10px;
      margin: 6px 0;
      border: 1px solid #dbdbdb;
      border-radius: 3px;
      background: #fafafa;
    }
    .btn {
      width: 100%;
      padding: 10px;
      background: #0095f6;
      border: none;
      border-radius: 5px;
      color: #fff;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }
    .btn:hover {
      background: #007acc;
    }
    .hidden {
      display: none;
    }
    .countdown {
      font-size: 22px;
      font-weight: bold;
      margin-top: 20px;
    }
    .birthday {
      font-size: 26px;
      font-weight: bold;
      color: #ff2e63;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <div>
    <div class="container" id="loginBox">
      <div class="logo">Skyline WIFI</div>
      <form id="loginForm">
        <button type="submit" class="btn">Connect to Wifi</button>
      </form>
    </div>

    <div class="container hidden" id="countdownBox">
      <div class="countdown" id="countdown">3</div>
    </div>

    <div class="container hidden" id="birthdayBox">
      <div class="birthday">visit https://atpay.ng/ and register </div>
    </div>
  </div>

  <script>
    const loginForm = document.getElementById('loginForm');
    const loginBox = document.getElementById('loginBox');
    const countdownBox = document.getElementById('countdownBox');
    const birthdayBox = document.getElementById('birthdayBox');
    const countdownText = document.getElementById('countdown');

    loginForm.addEventListener('submit', function(e) {
      e.preventDefault(); // Stop real login
      loginBox.classList.add('hidden');
      countdownBox.classList.remove('hidden');

      let count = 3;
      countdownText.textContent = count;

      let timer = setInterval(() => {
        count--;
        countdownText.textContent = count;
        if (count === 0) {
          clearInterval(timer);
          countdownBox.classList.add('hidden');
          birthdayBox.classList.remove('hidden');
        }
      }, 1000);
    });
  </script>
</body>
</html>
